name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }} (${{ matrix.covers }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: "8.1", covers: "Symfony 6.4, DBAL 3", with: "--with doctrine/dbal:^3.8" }
          - { php: "8.2", covers: "Symfony 7.4, DBAL 4", with: "" }
          - { php: "8.3", covers: "Symfony 7.4, DBAL 3", with: "--with doctrine/dbal:^3.8" }
          - { php: "8.4", covers: "Symfony 8, DBAL 4", with: "" }
          - { php: "8.5", covers: "Symfony 8, DBAL 4", with: "" }
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, zlib, pdo_sqlite
          coverage: none
          tools: composer:v2
      - run: composer update --no-progress ${{ matrix.with }}
      - run: composer check-format
      - run: composer analyse
      - name: test (a test kernel)
        run: composer test

  example:
    name: example app against a fake ingest, PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.5"]
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, zlib, pdo_sqlite
          coverage: none
          tools: composer:v2
      - run: composer install --no-progress
      - run: vendor/bin/phpunit
