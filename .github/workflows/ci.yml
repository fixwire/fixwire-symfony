name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# bash on Windows too: cmd.exe, which runs composer.bat, takes the ^ of a constraint for an escape.
defaults:
  run:
    shell: bash

jobs:
  test:
    name: PHP ${{ matrix.php }} (${{ matrix.covers }})${{ matrix.os && format(', {0}', matrix.os) || '' }}
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: "8.1", covers: "Symfony 6.4, DBAL 3", with: "--with doctrine/dbal:^3.8" }
          - { php: "8.2", covers: "Symfony 7.4, DBAL 4", with: "" }
          - { php: "8.3", covers: "Symfony 7.4, DBAL 3", with: "--with doctrine/dbal:^3.8" }
          - { php: "8.4", covers: "Symfony 8, DBAL 4", with: "" }
          - { php: "8.5", covers: "Symfony 8, DBAL 4", with: "" }
          - { php: "8.5", covers: "Symfony 8, DBAL 4", with: "", os: macos-latest }
          - { php: "8.5", covers: "Symfony 8, DBAL 4", with: "", os: windows-latest }
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, fileinfo, mbstring, zlib, pdo_sqlite
          coverage: none
          tools: composer:v2
      # The bundle is built next to the core's main branch, so it is tested against it; the
      # version it requires (^0.1) is what a release of both pins.
      - name: the core's main branch
        run: composer require --no-update "fixwire/fixwire:dev-main as 0.1.99"
      - run: composer update --no-progress ${{ matrix.with }}
      - run: composer check-format
      - run: composer analyse
      - name: test (a test kernel)
        run: composer test

  example:
    name: example app against a fake ingest, PHP ${{ matrix.php }}, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: ["8.1", "8.5"]
        include:
          - { os: macos-latest, php: "8.5" }
          - { os: windows-latest, php: "8.5" }
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, fileinfo, mbstring, zlib, pdo_sqlite
          coverage: none
          tools: composer:v2
      - run: composer install --no-progress
      - run: vendor/bin/phpunit
